[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "secure-agent-sandbox"
version = "0.1.0"
description = "Policy engine and execution receipts for least-privilege agent sandboxes"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["src/secure_sandbox"]

